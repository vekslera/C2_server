version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: c2_postgres
    environment:
      POSTGRES_DB: c2_logs
      POSTGRES_USER: c2admin
      POSTGRES_PASSWORD: c2password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/init_db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U c2admin -d c2_logs"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
